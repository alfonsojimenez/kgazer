services:
  backend:
    build:
      context: ./backend
      args:
        VERSION: ${KGAZER_VERSION:-dev}
    ports:
      - "${KGAZER_PORT_API:-1899}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      KGAZER_CONFIG: /app/config.yml
      KGAZER_DB_HOST: db

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${KGAZER_PORT_UI:-4200}:5173"
    environment:
      - API_PROXY_TARGET=http://backend:8080
    command: sh -c "[ ! -d node_modules/.bin ] && npm install; echo '' && echo '  🚀 KGazer ready at http://localhost:${KGAZER_PORT_UI:-4200}' && echo '' && npm run dev"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    command: postgres -c max_wal_size=4GB
    ports:
      - "${KGAZER_PORT_DB:-5899}:5432"
    environment:
      POSTGRES_USER: kgazer
      POSTGRES_PASSWORD: kgazer
      POSTGRES_DB: kgazer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgazer"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  test:
    build:
      context: ./backend
      target: builder
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://kgazer:kgazer@db-test:5432/kgazer_test?sslmode=disable
    command: go test -tags musl -v -count=1 -p 1 ./...
    profiles:
      - test

  test-frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm test"
    profiles:
      - test

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kgazer
      POSTGRES_PASSWORD: kgazer
      POSTGRES_DB: kgazer_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgazer"]
      interval: 2s
      timeout: 2s
      retries: 5
    profiles:
      - test

volumes:
  pgdata:
  frontend_node_modules:
